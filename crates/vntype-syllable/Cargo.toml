[package]
name = "vntype-syllable"
description = "Mô hình âm vị học, tách âm tiết, kiểm tra chính tả và đặt dấu thanh tiếng Việt."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
repository.workspace = true

[features]
default = ["std"]
std = ["unicode-normalization/std"]
serde = ["dep:serde"]

[dependencies]
serde = { workspace = true, optional = true }
spin = { version = "0.12.3", default-features = false, features = ["once"] }
unicode-normalization = { workspace = true, default-features = false }
