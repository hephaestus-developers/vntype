name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-linux-deb:
    name: Linux (.deb)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake pkg-config g++ dpkg-dev extra-cmake-modules libgtk-3-dev libfcitx5core-dev libfcitx5utils-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build .deb packages
        run: bash packaging/linux/package-deb.sh --release

      - name: Upload .deb artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-deb
          path: dist/linux/*.deb

  build-linux-rpm:
    name: Linux (.rpm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake pkg-config g++ rpm extra-cmake-modules libgtk-3-dev libfcitx5core-dev libfcitx5utils-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build .rpm packages
        run: bash packaging/linux/package-rpm.sh

      - name: Upload .rpm artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-rpm
          path: dist/linux/*.rpm

  build-windows-zip:
    name: Windows (Portable .zip)
    runs-on: windows-latest
    strategy:
      matrix:
        include:
          - arch: x86_64
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: Build Windows portable .zip
        shell: pwsh
        run: |
          ./packaging/windows/package-zip.ps1 -Arch ${{ matrix.arch }} -Target ${{ matrix.target }}

      - name: Upload Windows .zip artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-zip-${{ matrix.arch }}
          path: dist/windows/*.zip

  publish-release:
    name: Publish GitHub Release
    needs: [build-linux-deb, build-linux-rpm, build-windows-zip]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release-assets/*.deb
            release-assets/*.rpm
            release-assets/*.zip
