<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="VNType Logo">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E11D48"/>
      <stop offset="55%" stop-color="#BE123C"/>
      <stop offset="100%" stop-color="#881337"/>
    </linearGradient>
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.0"/>
    </linearGradient>
  </defs>
<!--Rounded keycap/app icon base-->
  <rect x="16" y="16" width="224" height="224" rx="32" fill="url(#bgGrad)"/>
  <rect x="20" y="20" width="216" height="110" rx="30" fill="url(#glassGrad)"/>
  <rect x="16" y="16" width="224" height="224" rx="32" fill="none" stroke="#FFFFFF" stroke-opacity="0.16" stroke-width="3"/>
<!--Stylized bold V, centered-->
  <path d="M74 96 L116 196 C120 205 136 205 140 196 L182 96" transform="translate(0 -22)" fill="none" stroke="#FFFFFF" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>
<!--Subtle tone dot/sparkle-->
  <circle cx="188" cy="70" r="10" fill="url(#accentGrad)"/>
</svg>
