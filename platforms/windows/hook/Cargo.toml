[package]
name = "vntype-hook"
description = "Trình nền Hook bàn phím mức thấp (WH_KEYBOARD_LL), Tray và OSD trên Windows."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
repository.workspace = true

[[bin]]
name = "vntype-hook"
path = "src/main.rs"

[dependencies]
vntype-config = { workspace = true }
vntype-engine = { workspace = true }
vntype-adapter = { workspace = true }
vntype-win-ipc = { workspace = true }
vntype-settings = { path = "../../../apps/vntype-settings" }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Console",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
