[workspace]
resolver = "2"
members = [
    "crates/*",
    "apps/*",
    "platforms/linux/ibus",
    "platforms/linux/settings",
    "platforms/windows/*",
]

[workspace.package]
version = "2026.11.3"
edition = "2024"
rust-version = "1.89"
license = "MIT"
authors = ["Hephaestus Developers <haiphamngoc.tech@gmail.com>"]
keywords = ["vietnamese", "typing", "input-method", "keyboard"]
categories = ["text-processing", "development-tools::cli"]
description = "Bộ gõ tiếng Việt"
repository = "https://github.com/hephaestus-developers/vntype"

[workspace.dependencies]
vntype-syllable = { path = "crates/vntype-syllable", default-features = false }
vntype-core = { path = "crates/vntype-core" }
vntype-config = { path = "crates/vntype-config" }
vntype-settings-core = { path = "crates/vntype-settings-core" }
vntype-engine = { path = "crates/vntype-engine" }
vntype-adapter = { path = "crates/vntype-adapter" }
vntype-ffi = { path = "crates/vntype-ffi" }
vntype-win-ipc = { path = "platforms/windows/ipc" }
arrayvec = { version = "0.7.8", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
unicode-normalization = { version = "0.1.26", default-features = false }
serde_json = "1.0.154"
thiserror = "2.0.21"
blake3 = { version = "1.8.7", features = ["pure"] }
zbus = "6.5.0"
windows = "0.62.2"
windows-core = "0.62.2"
windows-implement = "0.60.2"
windows-sys = "0.61.2"
gtk = "0.19.0"
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }

[profile.release]
lto = true
codegen-units = 1
panic = "unwind"
opt-level = 3
